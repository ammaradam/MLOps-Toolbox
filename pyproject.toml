[project]
name = "mlops-toolbox"
version = "0.1.0"
description = "Composable building blocks for the end-to-end ML lifecycle"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
dependencies = [
    "pydantic>=2.6",
    "pydantic-settings>=2.4",
    "numpy>=1.26",
    "pandas>=2.1",
]

[project.optional-dependencies]
# Extras are named after lifecycle stages, not the backend tools that currently
# implement them — backends are swappable implementation details.
tracking = ["mlflow>=3.1", "pyarrow>=14"]
registry = ["mlops-toolbox[tracking]"]
monitoring = ["evidently>=0.4"]
deploy = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
dashboard = [
    "mlops-toolbox[tracking]",
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
]
cli = ["typer>=0.12"]
all = ["mlops-toolbox[tracking,registry,monitoring,deploy,dashboard,cli]"]

[project.scripts]
mt = "mlops_toolbox.cli:main"

[dependency-groups]
docs = ["mkdocs-material>=9.5"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.1",
    "scikit-learn>=1.4",
    "httpx>=0.27",
    "mlops-toolbox[all]",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mlops_toolbox"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["mlops_toolbox"]

[tool.pytest.ini_options]
testpaths = ["tests"]
