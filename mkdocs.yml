site_name: mlops-toolbox
site_description: Composable, backend-agnostic building blocks for the end-to-end ML lifecycle.
repo_url: https://github.com/ammaradam/MLOps-Toolbox
repo_name: ammaradam/MLOps-Toolbox
site_url: https://ammaradam.github.io/MLOps-Toolbox/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.sections
    - navigation.footer
    - content.code.copy
    - content.tabs.link

markdown_extensions:
  - admonition
  - pymdownx.highlight
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Concepts:
      - Model contracts: concepts/contracts.md
      - Lifecycle health: concepts/lifecycle-health.md
  - Guides:
      - For software engineers: guides/software-engineers.md
      - For data scientists: guides/data-scientists.md
      - Team setup (shared stores): guides/team-setup.md
  - Reference:
      - CLI: reference/cli.md
      - Python API: reference/python-api.md
  - Dashboard: dashboard.md
