<svg width="920" height="430" viewBox="0 0 920 430" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .contractbox { fill: #ecfdf5; stroke: #6ee7b7; stroke-width: 1.5; }
    .storebox { fill: #f1f5f9; stroke: #94a3b8; stroke-width: 1.5; }
    .dashboardbox { fill: #eef2ff; stroke: #a5b4fc; stroke-width: 1.5; }
    .clichip { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .label { fill: #0f172a; font-size: 14px; font-weight: 600; }
    .sub { fill: #64748b; font-size: 11px; }
    .caption { fill: #64748b; font-size: 11px; }
    .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .flow { stroke: #6ee7b7; stroke-width: 1.5; fill: none; marker-end: url(#arrowGreen); }
    .dash { stroke: #a5b4fc; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrowIndigo); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e293b; stroke: #475569; }
      .contractbox { fill: #064e3b; stroke: #34d399; }
      .storebox { fill: #0f172a; stroke: #64748b; }
      .dashboardbox { fill: #312e81; stroke: #6366f1; }
      .clichip { fill: #1e293b; stroke: #475569; }
      .label { fill: #e2e8f0; }
      .sub { fill: #94a3b8; }
      .caption { fill: #94a3b8; }
      .arrow { stroke: #64748b; }
      .flow { stroke: #34d399; }
      .dash { stroke: #818cf8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowGreen" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6ee7b7" />
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc" />
    </marker>
  </defs>

  <!-- training path: data -> tracking -> evaluation -> registry -->
  <g>
    <rect class="box" x="15"  y="30" width="150" height="60" rx="8" />
    <rect class="box" x="190" y="30" width="150" height="60" rx="8" />
    <rect class="box" x="365" y="30" width="150" height="60" rx="8" />
    <rect class="box" x="540" y="30" width="160" height="60" rx="8" />

    <text class="label" x="90"  y="56" text-anchor="middle">Data</text>
    <text class="sub"   x="90"  y="74" text-anchor="middle">validate · split</text>

    <text class="label" x="265" y="56" text-anchor="middle">Tracking</text>
    <text class="sub"   x="265" y="74" text-anchor="middle">runs · params · metrics</text>

    <text class="label" x="440" y="56" text-anchor="middle">Evaluation</text>
    <text class="sub"   x="440" y="74" text-anchor="middle">reports · quality gates</text>

    <text class="label" x="620" y="56" text-anchor="middle">Registry</text>
    <text class="sub"   x="620" y="74" text-anchor="middle">versions · aliases</text>
  </g>

  <path class="arrow" d="M165,60 L188,60" />
  <path class="arrow" d="M340,60 L363,60" />
  <path class="arrow" d="M515,60 L538,60" />

  <!-- the contract: registered with the model, consumed by everything downstream -->
  <rect class="contractbox" x="505" y="128" width="230" height="52" rx="8" />
  <text class="label" x="620" y="150" text-anchor="middle">Model contract</text>
  <text class="sub"   x="620" y="167" text-anchor="middle">schema · eval · drift baselines</text>
  <path class="flow" d="M620,90 L620,126" />

  <!-- consumers of the contract -->
  <g>
    <rect class="box" x="15"  y="240" width="150" height="60" rx="8" />
    <rect class="box" x="190" y="240" width="150" height="60" rx="8" />
    <rect class="box" x="365" y="240" width="150" height="60" rx="8" />
    <rect class="box" x="540" y="240" width="160" height="60" rx="8" />

    <text class="label" x="90"  y="266" text-anchor="middle">Serving</text>
    <text class="sub"   x="90"  y="284" text-anchor="middle">typed /predict API</text>

    <text class="label" x="265" y="266" text-anchor="middle">Scoring</text>
    <text class="sub"   x="265" y="284" text-anchor="middle">validated batches</text>

    <text class="label" x="440" y="266" text-anchor="middle">Monitoring</text>
    <text class="sub"   x="440" y="284" text-anchor="middle">input + prediction drift</text>

    <text class="label" x="620" y="266" text-anchor="middle">CI</text>
    <text class="sub"   x="620" y="284" text-anchor="middle">gates · doctor · cards</text>
  </g>

  <path class="flow" d="M505,150 L90,150 L90,238" />
  <path class="flow" d="M505,160 L265,160 L265,238" />
  <path class="flow" d="M560,180 L560,208 L440,208 L440,238" />
  <path class="flow" d="M620,180 L620,238" />

  <!-- local store: everything above persists here -->
  <rect class="storebox" x="15" y="340" width="685" height="42" rx="8" />
  <text class="label" x="357" y="360" text-anchor="middle">Local tracking store</text>
  <text class="sub"   x="357" y="375" text-anchor="middle">runs · metrics · models · contracts · baselines — one file, no server</text>

  <!-- dashboard reads the store across all registered projects -->
  <rect class="dashboardbox" x="750" y="240" width="155" height="142" rx="8" />
  <text class="label" x="827" y="296" text-anchor="middle">Dashboard</text>
  <text class="sub"   x="827" y="314" text-anchor="middle">all projects · health</text>
  <text class="sub"   x="827" y="330" text-anchor="middle">runs · models · trends</text>
  <path class="dash" d="M702,361 L748,361" />

  <!-- mt CLI chip -->
  <rect class="clichip" x="750" y="30" width="155" height="60" rx="8" />
  <text class="label" x="827" y="50" text-anchor="middle">mt CLI</text>
  <text class="sub"   x="827" y="66" text-anchor="middle">init · serve · ship · score</text>
  <text class="sub"   x="827" y="80" text-anchor="middle">gate · drift · card · doctor</text>

  <text class="caption" x="460" y="416" text-anchor="middle">
    solid green = the contract propagating; dashed = read-only queries across every registered project's store
  </text>
</svg>
