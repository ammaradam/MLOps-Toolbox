<svg width="900" height="230" viewBox="0 0 900 230" xmlns="http://www.w3.org/2000/svg" font-family="-apple-system, Segoe UI, Helvetica, Arial, sans-serif">
  <style>
    .box { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1.5; }
    .dashboardbox { fill: #eef2ff; stroke: #a5b4fc; stroke-width: 1.5; }
    .label { fill: #0f172a; font-size: 14px; font-weight: 600; }
    .sub { fill: #64748b; font-size: 11px; }
    .caption { fill: #64748b; font-size: 11px; }
    .arrow { stroke: #94a3b8; stroke-width: 1.5; fill: none; marker-end: url(#arrow); }
    .dash { stroke: #a5b4fc; stroke-width: 1.5; fill: none; stroke-dasharray: 4 3; marker-end: url(#arrowIndigo); }
    @media (prefers-color-scheme: dark) {
      .box { fill: #1e293b; stroke: #475569; }
      .dashboardbox { fill: #312e81; stroke: #6366f1; }
      .label { fill: #e2e8f0; }
      .sub { fill: #94a3b8; }
      .caption { fill: #94a3b8; }
      .arrow { stroke: #64748b; }
      .dash { stroke: #818cf8; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#94a3b8" />
    </marker>
    <marker id="arrowIndigo" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a5b4fc" />
    </marker>
  </defs>

  <!-- lifecycle stage boxes -->
  <g>
    <rect class="box" x="15"  y="30" width="130" height="60" rx="8" />
    <rect class="box" x="161" y="30" width="130" height="60" rx="8" />
    <rect class="box" x="307" y="30" width="130" height="60" rx="8" />
    <rect class="box" x="453" y="30" width="130" height="60" rx="8" />
    <rect class="box" x="599" y="30" width="130" height="60" rx="8" />
    <rect class="box" x="745" y="30" width="130" height="60" rx="8" />

    <text class="label" x="80"  y="56" text-anchor="middle">Data</text>
    <text class="sub"   x="80"  y="74" text-anchor="middle">pydantic</text>

    <text class="label" x="226" y="56" text-anchor="middle">Tracking</text>
    <text class="sub"   x="226" y="74" text-anchor="middle">MLflow</text>

    <text class="label" x="372" y="56" text-anchor="middle">Registry</text>
    <text class="sub"   x="372" y="74" text-anchor="middle">MLflow</text>

    <text class="label" x="518" y="56" text-anchor="middle">Evaluation</text>
    <text class="sub"   x="518" y="74" text-anchor="middle">numpy</text>

    <text class="label" x="664" y="56" text-anchor="middle">Monitoring</text>
    <text class="sub"   x="664" y="74" text-anchor="middle">Evidently</text>

    <text class="label" x="810" y="56" text-anchor="middle">Deployment</text>
    <text class="sub"   x="810" y="74" text-anchor="middle">FastAPI</text>
  </g>

  <!-- connectors between stages -->
  <path class="arrow" d="M145,60 L159,60" />
  <path class="arrow" d="M291,60 L305,60" />
  <path class="arrow" d="M437,60 L451,60" />
  <path class="arrow" d="M583,60 L597,60" />
  <path class="arrow" d="M729,60 L743,60" />

  <!-- dashboard box -->
  <rect class="dashboardbox" x="350" y="160" width="200" height="50" rx="8" />
  <text class="label" x="450" y="190" text-anchor="middle">Dashboard</text>

  <!-- dashed connectors: tracking / registry / monitoring stores are read by the dashboard -->
  <path class="dash" d="M226,90 L226,130 L410,130 L410,158" />
  <path class="dash" d="M372,90 L372,140 L440,140 L440,158" />
  <path class="dash" d="M664,90 L664,130 L490,130 L490,158" />

  <text class="caption" x="450" y="222" text-anchor="middle">
    dashed = read-only queries across every registered project's tracking store
  </text>
</svg>
